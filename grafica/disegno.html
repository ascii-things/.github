<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:JB;src:url(JetBrainsMono-Regular.ttf)}
html,body{margin:0;background:#07080c}canvas{display:block}
</style>
<canvas id="c"></canvas>
<script>
// Disegna con caratteri su una griglia, come gli altri progetti: ?tipo=banner | avatar
const tipo = new URLSearchParams(location.search).get('tipo') || 'banner';
const W = tipo === 'banner' ? 1280 : 500, H = tipo === 'banner' ? 420 : 500;
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
let seme = 12345; const caso = () => (seme = (seme * 1103515245 + 12345) % 2147483648) / 2147483648;
const CW = tipo === 'banner' ? 8 : 14, CH = tipo === 'banner' ? 14 : 25;   // cella
const cols = Math.floor(W / CW), rows = Math.floor(H / CH);
const ox = (W - cols * CW) / 2, oy = (H - rows * CH) / 2;
const celle = [];
function metti(x, y, ch, col, glow = 0) { if (x >= 0 && y >= 0 && x < cols && y < rows) celle[y * cols + x] = { ch, col, glow }; }
function testo(x, y, s, col, glow) { [...s].forEach((ch, i) => ch !== ' ' && metti(x + i, y, ch, col, glow)); }
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;

// font a blocchi 5x7
const F = {
 A:["01110","10001","10001","11111","10001","10001","10001"], S:["01111","10000","10000","01110","00001","00001","11110"],
 C:["01111","10000","10000","10000","10000","10000","01111"], I:["11111","00100","00100","00100","00100","00100","11111"],
 T:["11111","00100","00100","00100","00100","00100","00100"], H:["10001","10001","10001","11111","10001","10001","10001"],
 N:["10001","11001","10101","10101","10011","10001","10001"], G:["01111","10000","10000","10111","10001","10001","01111"], " ":["00000","00000","00000","00000","00000","00000","00000"]};
const RAMPA = "#%@O*";
const DIM = tipo === "banner" ? 1.12 : 1;
function grande(parola, x0, y0, sx, sy, c1, c2) {
  const larg = parola.length * 6 * sx;
  [...parola].forEach((L, i) => F[L].forEach((riga, ry) => [...riga].forEach((b, rx) => {
    if (b !== '1') return;
    for (let a = 0; a < sy; a++) for (let d = 0; d < sx; d++) {
      const x = x0 + (i * 6 + rx) * sx + d, y = y0 + ry * sy + a;
      const t = (x - x0) / larg;
      metti(x, y, RAMPA[Math.floor(caso() * RAMPA.length)], mix(c1, c2, t), 1);
    }
  })));
  return larg;
}

// cielo: stelle
for (let i = 0; i < cols * rows * 0.035; i++) metti(Math.floor(caso() * cols), Math.floor(caso() * rows), caso() < 0.8 ? '.' : '+', mix([70, 80, 110], [190, 200, 230], caso()), caso() < 0.2 ? 0.6 : 0);

if (tipo === 'banner') {
  // onde in basso
  for (let y = rows - 4; y < rows; y++) for (let x = 0; x < cols; x++) {
    const v = Math.sin(x * 0.23 + y * 1.7) + Math.sin(x * 0.07 - y);
    if (v > 0.6) metti(x, y, '~', mix([30, 60, 100], [70, 140, 200], (y - rows + 4) / 4), 0.3);
  }
  // titolo
  const sx = 2, sy = 2, larg = "ASCII THINGS".length * 6 * sx;
  const x0 = Math.floor((cols - larg) / 2) + 1, y0 = 2;
  grande("ASCII THINGS", x0, y0, sx, sy, [80, 230, 190], [255, 170, 70]);
  const sotto = "small, fast, open-source software made of text";
  testo(Math.floor((cols - sotto.length) / 2), y0 + 16, sotto, [200, 208, 225], 0.2);
  const tag = "Rust  ·  Windows · macOS · Linux  ·  built with Claude Code";
  testo(Math.floor((cols - tag.length) / 2), y0 + 18, tag, [110, 125, 150], 0);
  // koi e pesciolini
  testo(14, rows - 6, "><(((('>", [255, 150, 60], 0.8);
  testo(cols - 30, rows - 7, "<'))))><", [255, 210, 120], 0.8);
  testo(Math.floor(cols * 0.55), rows - 5, "><>", [120, 200, 255], 0.6);
  testo(8, 2, "*", [255, 240, 200], 1); testo(cols - 10, 4, "+", [255, 240, 200], 1);
} else {
  // avatar: una "A" grande + cursore, dentro un cerchio di caratteri
  const cx = cols / 2, cy = rows / 2;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const d = Math.hypot((x - cx + 0.5) * CW, (y - cy + 0.5) * CH) / (W / 2);
    if (d > 0.93 && d < 1.0) metti(x, y, ':', [60, 90, 120], 0.2);
  }
  const larg = grande("A", Math.floor(cx - 7.5), Math.floor(cy - 7) - 1, 3, 2, [80, 230, 190], [255, 170, 70]);
  testo(Math.floor(cx) + 6, Math.floor(cy) + 5, "_", [255, 255, 255], 1);
  testo(Math.floor(cx) - 9, Math.floor(cy) + 6, "><(('>", [255, 150, 60], 0.7);
}

document.fonts.load(`${CH * 0.8}px JB`).then(() => {
  g.fillStyle = '#07080c'; g.fillRect(0, 0, W, H);
  const grad = g.createRadialGradient(W / 2, H * 0.35, 10, W / 2, H * 0.35, W * 0.7);
  grad.addColorStop(0, 'rgba(30,50,70,0.35)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.font = `${CH * 0.8 * DIM}px JB`; g.textBaseline = 'middle'; g.textAlign = 'center';
  celle.forEach((k, i) => { if (!k) return;
    const x = ox + (i % cols) * CW + CW / 2, y = oy + Math.floor(i / cols) * CH + CH / 2;
    g.shadowColor = rgb(k.col); g.shadowBlur = k.glow * 14; g.fillStyle = rgb(k.col); g.fillText(k.ch, x, y);
  });
  document.title = 'pronto';
});
</script>
